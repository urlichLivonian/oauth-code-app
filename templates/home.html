<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OAuth Code Flow Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      pre { background-color: #f5f5f5; padding: 1rem; border-radius: 4px; }
      .actions { margin-top: 1.5rem; }
      .actions a { margin-right: 1rem; }
    </style>
  </head>
  <body>
    <h1>Authorization Code Flow with Keycloak</h1>
    {% if authenticated %}
      <section>
        <h2>User Information</h2>
        <pre>{{ user_info | tojson(indent=2) }}</pre>
      </section>
      <section>
        <h2>Tokens</h2>
        <pre>{{ tokens | tojson(indent=2) }}</pre>
      </section>
      <div class="actions">
        <a href="{{ url_for('logout') }}">Logout</a>
      </div>
    {% else %}
      <p>Your session is not authenticated.</p>
      <div class="actions">
        <a href="{{ url_for('login') }}">Login with Keycloak</a>
      </div>
    {% endif %}
  </body>
</html>
